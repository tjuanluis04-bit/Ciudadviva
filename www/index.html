.sl input{flex:1;accent-color:var(--lamp);height:28px}

#meta{flex:1;min-width:0}#sn{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ss,#sa{color:var(--mut);font-size:13px;display:block}#sa{color:var(--tx);margin-top:2px}
#sf,#sx{padding:0 14px;flex:none}#sx{width:44px;padding:0}
@media(min-width:700px){#dock,#sheet{left:50%;right:auto;width:420px;transform:translateX(-50%)}#sheet.hide{transform:translate(-50%,16px)}}

function render(tm){const k=dpr*cam.z,L=cam.x-vw/(2*cam.z),Tp=cam.y-vh/(2*cam.z),Rr=cam.x+vw/(2*cam.z),Bt=cam.y+vh/(2*cam.z);
ctx.setTransform(k,0,0,k,-L*k,-Tp*k);ctx.fillStyle='#6F8A63';ctx.fillRect(L-5,Tp-5,Rr-L+10,Bt-Tp+10);
ctx.fillStyle='#343B4A';for(let i=0;i<=N;i++){ctx.fillRect(i*P-H,-H,R,MAP+R);ctx.fillRect(-H,i*P-H,MAP+R,R)}
ctx.strokeStyle='#E9D9A0';ctx.lineWidth=1.6;ctx.setLineDash([12,10]);ctx.beginPath();for(let i=0;i<=N;i++)for(let j=0;j<N;j++){ctx.moveTo(i*P,j*P+H);ctx.lineTo(i*P,(j+1)*P-H);ctx.moveTo(j*P+H,i*P);ctx.lineTo((j+1)*P-H,i*P)}ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='rgba(240,240,235,.8)';ctx.beginPath();for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){const x=i*P,y=j*P;if(x<L-60||x>Rr+60||y<Tp-60||y>Bt+60)continue;for(const s of[-1,1])for(let q=-24;q<=24;q+=12){ctx.rect(x+q-2.5,y+s*35-6,5,12);ctx.rect(x+s*35-6,y+q-2.5,12,5)}}ctx.fill();
const sun=sunV(hour),sa=Math.PI+((hour-6)/12)*Math.PI,sl=.45+1.4*Math.abs(hour-12)/6,vis=b=>b.x+b.w>L-80&&b.x<Rr+80&&b.y+b.w>Tp-80&&b.y<Bt+80;
for(const b of blocks){if(!vis(b))continue;ctx.fillStyle='#C9C5BA';rr(b.x-SW,b.y-SW,b.w+2*SW,b.w+2*SW,12);ctx.fill();
if(b.type=='park'){ctx.fillStyle='#6C9A5A';rr(b.x,b.y,b.w,b.w,8);ctx.fill();ctx.strokeStyle='#CBBF9A';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(b.x,b.y+b.w);ctx.lineTo(b.x+b.w,b.y);ctx.stroke()}
else if(b.type=='plaza'){ctx.fillStyle='#D6D1C4';rr(b.x,b.y,b.w,b.w,8);ctx.fill();ctx.fillStyle='#BFC7CF';ctx.beginPath();ctx.arc(b.cx,b.cy,26,0,6.3);ctx.fill();ctx.fillStyle='#6CB4D6';ctx.beginPath();ctx.arc(b.cx,b.cy,21,0,6.3);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.cx,b.cy,4+(tm*7)%16,0,6.3);ctx.stroke()}
else{ctx.fillStyle='#B8B4A9';rr(b.x,b.y,b.w,b.w,8);ctx.fill()}}
if(sun>0){ctx.fillStyle=`rgba(10,14,30,${.3*Math.min(1,sun*3)})`;for(const b of blocks){if(!vis(b))continue;for(const q of b.bl){const l=q.hg*sl*.55;sweep(q.x,q.y,q.w,q.h,Math.cos(sa)*l,Math.sin(sa)*l);ctx.fill()}for(const t of b.tr){ctx.beginPath();ctx.arc(t.x+Math.cos(sa)*sl*9,t.y+Math.sin(sa)*sl*9,t.r,0,6.3);ctx.fill()}}}
for(const b of blocks){if(!vis(b))continue;for(const q of b.bl){const ox=(b.cx-cam.x)*q.hg/1800,oy=(b.cy-cam.y)*q.hg/1800;ctx.fillStyle=shade(q.col,.62);sweep(q.x,q.y,q.w,q.h,ox,oy);ctx.fill();ctx.fillStyle=q.col;rr(q.x+ox,q.y+oy,q.w,q.h,3);ctx.fill();ctx.fillStyle='rgba(255,255,255,.14)';rr(q.x+ox+4,q.y+oy+4,q.w-8,q.h-8,2);ctx.fill();ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(q.x+ox+q.w*q.ac[0],q.y+oy+q.h*q.ac[1],q.w*.18,q.h*.14)}
for(const t of b.tr){ctx.fillStyle=t.c;ctx.beginPath();ctx.arc(t.x+(b.cx-cam.x)/90,t.y+(b.cy-cam.y)/90,t.r,0,6.3);ctx.fill()}}
for(const l of lamps){if(l[0]<L-20||l[0]>Rr+20||l[1]<Tp-20||l[1]>Bt+20)continue;ctx.fillStyle='#4A4F5C';ctx.beginPath();ctx.arc(l[0],l[1],2.2,0,6.3);ctx.fill()}
for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){const x=i*P,y=j*P;if(x<L-60||x>Rr+60||y<Tp-60||y>Bt+60)continue;for(const d of DIRS){ctx.fillStyle=carGreen(i,j,d[0]?'ew':'ns')?'#4ADE80':'#F25F5C';const cx=x-d[0]*43.5-d[1]*LN,cy=y-d[1]*43.5+d[0]*LN;d[0]?ctx.fillRect(cx-1.2,cy-8,2.4,16):ctx.fillRect(cx-8,cy-1.2,16,2.4)}}
for(const p of peds)if(inView(p.x,p.y,30))drawPed(p,tm);for(const c of cars)if(inView(c.x,c.y,60))drawCar(c,tm);
const tw=sun>0?cl(1-Math.abs(sun-.12)/.18,0,1):0;ctx.setTransform(1,0,0,1,0,0);if(tw>0){ctx.fillStyle=`rgba(255,140,60,${.16*tw})`;ctx.fillRect(0,0,cv.width,cv.height)}
if(dark>.02){if(dk.width!==cv.width||dk.height!==cv.height){dk.width=cv.width;dk.height=cv.height}dc.globalCompositeOperation='source-over';dc.setTransform(1,0,0,1,0,0);dc.fillStyle=`rgba(8,12,34,${.74*dark})`;dc.fillRect(0,0,dk.width,dk.height);dc.globalCompositeOperation='destination-out';dc.setTransform(k,0,0,k,-L*k,-Tp*k);
for(const l of lamps)if(inView(l[0],l[1],90))dc.drawImage(spW,l[0]-80,l[1]-80,160,160);
for(const c of cars)if(inView(c.x,c.y,90))dc.drawImage(spW,c.x+Math.cos(c.ang)*(c.len/2+26)-50,c.y+Math.sin(c.ang)*(c.len/2+26)-50,100,100);
ctx.drawImage(dk,0,0);ctx.setTransform(k,0,0,k,-L*k,-Tp*k);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.3*dark;
for(const l of lamps)if(inView(l[0],l[1],90))ctx.drawImage(spY,l[0]-60,l[1]-60,120,120);
for(const c of cars)if(inView(c.x,c.y,90))ctx.drawImage(spY,c.x+Math.cos(c.ang)*(c.len/2+24)-40,c.y+Math.sin(c.ang)*(c.len/2+24)-40,80,80);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}}
/* ---- interfaz ---- */
let lt='',ls='';
function hud(){const h=Math.floor(hour),m=Math.floor((hour-h)*60),t=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');if(t!==lt){lt=t;$('tm').textContent=t;$('ph').textContent=hour<5?'Madrugada':hour<12?'Mañana':hour<14.5?'Mediodía':hour<18?'Tarde':hour<20?'Atardecer':'Noche';$('dy').textContent='Día '+day;$('hr').value=hour;$('np').textContent=peds.length;$('nc').textContent=cars.length}
if(sel){const p=sel.kind!==undefined,a=p?sel.act:sel.v<3?(sel.red?'Espera el semáforo':'Detenido en el tráfico'):sel.t=='Autobús'?'Recorre su ruta':'Va de camino',n=p?sel.name:sel.t;$('sa').textContent=a;if(ls!==n){ls=n;$('sn').textContent=n;$('av').style.background=p?sel.shirt:sel.col;$('av').textContent=p?sel.name[0]:sel.t[0];$('ss').textContent=p?`${({f:{adult:'Mujer',kid:'Niña',elder:'Mujer mayor'},m:{adult:'Hombre',kid:'Niño',elder:'Hombre mayor'}})[sel.g][sel.kind]} · ${sel.age} años · ${sel.job}`:`Conduce ${sel.name}`+(sel.t=='Autobús'?` · ${sel.pax} pasajeros`:'')}
$('sf').textContent=cam.follow?'Siguiendo':'Seguir';$('sf').setAttribute('aria-pressed',cam.follow)}}
function pickClear(){sel=null;ls='';$('sheet').classList.add('hide');cam.follow=false}
function tap(cx,cy){const wx=cam.x+(cx-vw/2)/cam.z,wy=cam.y+(cy-vh/2)/cam.z;let best=null,bd=1;for(const p of peds){const d=Math.hypot(p.x-wx,p.y-wy)/Math.max(14,18/cam.z);if(d<bd){bd=d;best=p}}for(const c of cars){const d=Math.hypot(c.x-wx,c.y-wy)/Math.max(c.len/2+6,20/cam.z);if(d<bd){bd=d;best=c}}
if(best){sel=best;ls='';cam.follow=true;$('sheet').classList.remove('hide')}else pickClear()}
const ptr=new Map();let tp=null,pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);tp={x:e.clientX,y:e.clientY,t:performance.now(),m:0};if(ptr.size==2){const[a,b]=[...ptr.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
cv.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;const n=[e.clientX,e.clientY];ptr.set(e.pointerId,n);
if(ptr.size==1){const dx=n[0]-o[0],dy=n[1]-o[1];tp.m+=Math.abs(dx)+Math.abs(dy);if(tp.m>8){cam.x-=dx/cam.z;cam.y-=dy/cam.z;cam.follow=false}}
else if(ptr.size==2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)cam.z=cl(cam.z*d/pd,.3,2.6);pd=d;tp.m=99}});
const up=e=>{ptr.delete(e.pointerId);if(e.type=='pointerup'&&tp&&tp.m<=8&&performance.now()-tp.t<400&&ptr.size==0)tap(e.clientX,e.clientY);if(ptr.size<2)pd=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=cl(cam.z*Math.exp(-e.deltaY*.001),.3,2.6)},{passive:false});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
$('hr').oninput=e=>{hour=+e.target.value;lt=''};$('sx').onclick=pickClear;$('sf').onclick=()=>{cam.follow=!cam.follow};
function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr}
addEventListener('resize',resize);resize();
for(let i=0;i<70;i++){const p=mkPed(true);p&&peds.push(p)}for(let i=0;i<26;i++){const c=mkCar(true);c&&cars.push(c)}
function frame(now){const rdt=Math.min(.05,(now-last)/1000);last=now;const dt=rdt*speed;
if(dt>0){hour+=dt*24/180;if(hour>=24){hour-=24;day++}T+=dt;let r=dt;while(r>0){const s=Math.min(r,.05);step(s);r-=s}}
if(sel&&cam.follow){const f=Math.min(1,rdt*4);cam.x+=(sel.x-cam.x)*f;cam.y+=(sel.y-cam.y)*f}
cam.x=cl(cam.x,-H,MAP+H);cam.y=cl(cam.y,-H,MAP+H);const s=sunV(hour);dark=1-smooth(s/.3);
render(now/1000);hud();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script></body></html>
